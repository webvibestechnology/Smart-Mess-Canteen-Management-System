<div class="container mt-4">

  <div class="card">

```
<div class="card-header">
  <h2>Add Subscription</h2>
</div>

<div class="card-body">

  <div
    *ngIf="errorMessage"
    class="alert alert-danger">

    {{ errorMessage }}

  </div>


  <form
    #subscriptionForm="ngForm"
    (ngSubmit)="saveSubscription()">


    <!-- Student -->

    <div class="mb-3">

      <label
        for="student"
        class="form-label">

        Student

      </label>

      <select
        id="student"
        name="student"
        class="form-select"
        [(ngModel)]="subscription.student"
        required>

        <option
          [ngValue]="null">

          Select Student

        </option>

        <option
          *ngFor="let student of students"
          [ngValue]="student">

          {{ student.name }}

        </option>

      </select>

    </div>


    <!-- Mess -->

    <div class="mb-3">

      <label
        for="mess"
        class="form-label">

        Mess

      </label>

      <select
        id="mess"
        name="mess"
        class="form-select"
        [(ngModel)]="subscription.mess"
        required>

        <option
          [ngValue]="null">

          Select Mess

        </option>

        <option
          *ngFor="let mess of messes"
          [ngValue]="mess">

          {{ mess.name }}

        </option>

      </select>

    </div>


    <!-- Plan -->

    <div class="mb-3">

      <label
        for="plan"
        class="form-label">

        Subscription Plan

      </label>

      <select
        id="plan"
        name="plan"
        class="form-select"
        [(ngModel)]="subscription.plan"
        required>

        <option value="MONTHLY">
          MONTHLY
        </option>

        <option value="QUARTERLY">
          QUARTERLY
        </option>

        <option value="YEARLY">
          YEARLY
        </option>

      </select>

    </div>


    <!-- Start Date -->

    <div class="mb-3">

      <label
        for="startDate"
        class="form-label">

        Start Date

      </label>

      <input
        id="startDate"
        type="date"
        name="startDate"
        class="form-control"
        [(ngModel)]="subscription.startDate"
        required>

    </div>


    <!-- End Date -->

    <div class="mb-3">

      <label
        for="endDate"
        class="form-label">

        End Date

      </label>

      <input
        id="endDate"
        type="date"
        name="endDate"
        class="form-control"
        [(ngModel)]="subscription.endDate"
        required>

    </div>


    <!-- Amount -->

    <div class="mb-3">

      <label
        for="amount"
        class="form-label">

        Amount

      </label>

      <input
        id="amount"
        type="number"
        name="amount"
        class="form-control"
        [(ngModel)]="subscription.amount"
        min="0">

    </div>


    <!-- Status -->

    <div class="mb-3">

      <label
        for="status"
        class="form-label">

        Status

      </label>

      <select
        id="status"
        name="status"
        class="form-select"
        [(ngModel)]="subscription.status">

        <option value="ACTIVE">
          ACTIVE
        </option>

        <option value="EXPIRED">
          EXPIRED
        </option>

        <option value="CANCELLED">
          CANCELLED
        </option>

      </select>

    </div>


    <!-- Buttons -->

    <div class="d-flex gap-2">

      <button
        type="submit"
        class="btn btn-primary"
        [disabled]="loading">

        {{ loading
          ? 'Saving...'
          : 'Save Subscription' }}

      </button>


      <button
        type="button"
        class="btn btn-secondary"
        (click)="cancel()">

        Cancel

      </button>

    </div>

  </form>

</div>
