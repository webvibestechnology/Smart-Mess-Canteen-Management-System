<h1>STUDENT LIST TEST</h1>

<p>Total Students: {{ students.length }}</p>

<div *ngFor="let student of students">

  <p>
    {{ student.id }} -
    {{ student.name }} -
    {{ student.email }}
  </p>

  <button
    type="button"
    (click)="editStudent(student.id)">
    Edit
  </button>

  <button
    type="button"
    (click)="deleteStudent(student.id)">
    Delete
  </button>

  <hr>

</div>

<button
  type="button"
  (click)="addStudent()">
  + Add Student
</button>
