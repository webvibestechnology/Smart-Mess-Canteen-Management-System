<div class="login-page">

  <div class="login-card">

    <div class="login-header">
      <h1>Smart Mess</h1>
      <p>Admin Login</p>
      <span>Login to Smart Mess & Canteen Management System</span>
    </div>

    <form (ngSubmit)="login()">

      <div class="form-group">
        <label for="email">Email</label>

        <input
          id="email"
          type="email"
          name="email"
          [(ngModel)]="email"
          placeholder="Enter your email"
          required
        />
      </div>

      <div class="form-group">
        <label for="password">Password</label>

        <input
          id="password"
          type="password"
          name="password"
          [(ngModel)]="password"
          placeholder="Enter your password"
          required
        />
      </div>

      <div
        *ngIf="errorMessage"
        class="error-message"
      >
        {{ errorMessage }}
      </div>

      <button
        type="submit"
        class="login-button"
        [disabled]="loading"
      >
        {{ loading ? 'Logging in...' : 'Login' }}
      </button>

    </form>

    <div class="login-footer">
      © 2026 Smart Mess & Canteen Management System
    </div>

  </div>

</div>
