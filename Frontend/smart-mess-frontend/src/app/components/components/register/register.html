<div class="register-page">

  <div class="register-card">

    <div class="register-header">

      <h1>Smart Mess</h1>

      <h2>Admin Registration</h2>

      <p>
        Create your admin account
      </p>

    </div>


    <form
      (ngSubmit)="register()"
      #registerForm="ngForm"
    >


      <div class="form-group">

        <label>Name</label>

        <input
          type="text"
          name="name"
          [(ngModel)]="name"
          placeholder="Enter your name"
          required
        />

      </div>


      <div class="form-group">

        <label>Email</label>

        <input
          type="email"
          name="email"
          [(ngModel)]="email"
          placeholder="Enter your email"
          required
        />

      </div>


      <div class="form-group">

        <label>Phone</label>

        <input
          type="text"
          name="phone"
          [(ngModel)]="phone"
          placeholder="Enter phone number"
        />

      </div>


      <div class="form-group">

        <label>Password</label>

        <input
          type="password"
          name="password"
          [(ngModel)]="password"
          placeholder="Create password"
          required
        />

      </div>


      <div
        *ngIf="errorMessage"
        class="error-message"
      >

        {{ errorMessage }}

      </div>


      <button
        type="submit"
        class="register-button"
        [disabled]="loading"
      >

        {{ loading ? 'Registering...' : 'Register' }}

      </button>


    </form>


    <div class="login-link">

      Already have an account?

      <button
        type="button"
        (click)="goToLogin()"
      >
        Sign In
      </button>

    </div>


    <div class="register-footer">

      © 2026 Smart Mess & Canteen Management System

    </div>

  </div>

</div>
